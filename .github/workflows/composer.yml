name: Composer

on:
    push:
        branches:
            - main
            - '*.x'
    pull_request:

permissions: read-all

jobs:
    audit:
        runs-on: ubuntu-latest

        name: Audit

        steps:
            -   uses: actions/checkout@v7

            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.5

            -   run: composer update
            -   run: composer audit

    outdated:
        runs-on: ubuntu-latest

        name: Outdated

        steps:
            -   uses: actions/checkout@v7

            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.5

            -   run: composer update
            -   run: composer outdated
