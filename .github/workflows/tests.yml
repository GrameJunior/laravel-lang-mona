name: Tests

on:
    push:
        branches:
            - main
            - '*.x'
    pull_request:

permissions: read-all

jobs:
    manifests:
        runs-on: ubuntu-latest

        name: Manifests

        steps:
            -   uses: actions/checkout@v7
            -   uses: actions/setup-node@v7
                with:
                    node-version: 'latest'

            -   name: Validate translation manifests
                run: >-
                    npx --yes ajv-cli@5.0.0 validate --spec=draft2020
                    -s resources/laravel-lang.schema.json -d 'src/*/laravel_lang.json'

    feature:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: true
            matrix:
                php: [ "8.3", "8.4", "8.5" ]
                laravel: [ "12.0", "13.0" ]

        name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}

        steps:
            -   uses: actions/checkout@v7

            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}

            -   name: Install dependencies
                run: composer require --dev laravel/framework:^${{ matrix.laravel }}

            -   name: Execute tests
                run: php vendor/bin/pest --exclude-group=arch

    feature-master:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: true
            matrix:
                php: [ "8.4", "8.5" ]

        name: PHP ${{ matrix.php }}, Laravel dev-master

        steps:
            -   uses: actions/checkout@v7

            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}

            -   name: Install Laravel master and Testbench
                run: |
                    # Pest's Laravel plugin still requires the Laravel 13 series.
                    composer require --dev --no-update --no-interaction \
                        'laravel/framework:dev-master as 13.99.x-dev' \
                        orchestra/testbench:12.x-dev orchestra/testbench-core:12.x-dev \
                        orchestra/workbench:12.x-dev orchestra/canvas:12.x-dev orchestra/canvas-core:12.x-dev
                    composer update --no-interaction --no-progress

            -   name: Execute tests
                run: php vendor/bin/pest --exclude-group=arch

    coverage:
        runs-on: ubuntu-latest

        name: Coverage

        steps:
            -   uses: actions/checkout@v7

            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    coverage: xdebug

            -   name: Install dependencies
                run: composer update

            -   name: Execute tests
                run: composer test:coverage

    architecture:
        runs-on: ubuntu-latest

        name: Architecture

        steps:
            -   uses: actions/checkout@v7

            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.5

            -   name: Install dependencies
                run: composer update

            -   name: Execute tests
                run: php vendor/bin/pest --group=arch
