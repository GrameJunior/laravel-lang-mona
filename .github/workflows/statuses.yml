name: Translation Status

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    pull-requests: write
    contents: write

jobs:
    sync:
        name: Synchronize
        
        runs-on: ubuntu-latest
        
        steps:
            -   uses: actions/checkout@v6
            -   uses: shivammathur/setup-php@v2

            -   name: Install dependencies
                run: composer update --no-progress --no-interaction

            -   name: Update status
                run: src/Toolkit/bin/toolkit.php src/Library

            -   name: Create a Pull Request
                uses: peter-evans/create-pull-request@v8
                id: pullRequest
                with:
                    branch: projects/status
                    branch-suffix: random
                    delete-branch: true
                    add-paths: src/*/locales/*/_status.json
                    title: "[source]: Translations status has been updated"
                    commit-message: 📃 Translation statuses have been updated
                    body: 📃 Translation statuses have been updated
                    labels: |
                        statuses
                        skip-changelog

            -   name: Merge PR
                if: steps.pullRequest.outputs.pull-request-number != ''
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: gh pr merge --merge --admin --delete-branch ${{ steps.pullRequest.outputs.pull-request-number }}
