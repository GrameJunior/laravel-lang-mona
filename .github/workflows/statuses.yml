name: Translation Status

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    pull-requests: write
    contents: write

jobs:
    sync:
        name: Synchronize
        if: github.ref == 'refs/heads/main'
        concurrency: translation-status
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v6
                with:
                    ref: main

            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.5'
                    extensions: intl, zip

            -   name: Install dependencies
                run: composer update --no-progress --no-interaction

            -   name: Update status
                run: php src/Toolkit/bin/toolkit status src/Library

            -   name: Create a Pull Request
                uses: peter-evans/create-pull-request@v8
                id: pullRequest
                with:
                    branch: projects/status
                    delete-branch: true
                    add-paths: ':(glob)src/Library/locales/*/_status.json'
                    title: "[source]: Translations status has been updated"
                    commit-message: 📃 Translation statuses have been updated
                    body: 📃 Translation statuses have been updated
                    labels: |
                        statuses
                        skip-changelog

            -   name: Merge PR
                if: steps.pullRequest.outputs.pull-request-number != ''
                env:
                    GH_TOKEN: ${{ github.token }}
                    PR_NUMBER: ${{ steps.pullRequest.outputs.pull-request-number }}
                    PR_HEAD_SHA: ${{ steps.pullRequest.outputs.pull-request-head-sha }}
                run: gh pr merge "$PR_NUMBER" --merge --delete-branch --match-head-commit "$PR_HEAD_SHA"
