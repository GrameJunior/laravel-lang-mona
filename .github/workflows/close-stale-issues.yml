name: Close Stale Issues and PRs

on:
    schedule:
        -   cron: '34 0 * * *'
    workflow_dispatch:

permissions:
    issues: write
    pull-requests: write

jobs:
    stale:
        name: Close Stale
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
                with:
                    days-before-stale: 30
                    days-before-close: 7
                    stale-issue-label: stale
                    stale-pr-label: stale
                    stale-issue-message: >-
                        This issue has been inactive for 30 days and will be closed in 7 days if there is no further activity.
                        If it still needs attention, please leave an update here.
                    stale-pr-message: >-
                        This pull request has been inactive for 30 days and will be closed in 7 days if there is no further activity.
                        If it is still in progress, please leave an update here.
