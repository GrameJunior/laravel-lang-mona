name: Unicode CLDR

on:
    workflow_dispatch:

jobs:
    update:
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v6

            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.5'
                    extensions: curl, mbstring, zip, pcntl, pdo, pdo_sqlite, iconv, json
                    coverage: none

            -   name: Install dependencies
                run: |
                    composer install --no-progress --no-interaction --optimize-autoloader --no-dev
                    npm ci --ignore-scripts

            -   name: Update data
                run: composer cldr:update

            -   name: Create a Pull Request
                uses: peter-evans/create-pull-request@v8
                id: pullRequest
                with:
                    branch: source/date
                    branch-suffix: random
                    delete-branch: true
                    add-paths: ./data
                    title: "[source]: CLDR data updated"
                    commit-message: 📦 CLDR data updated
                    body: 📦 CLDR data updated
                    labels: source

            -   name: Merge PR
                if: ${{ steps.pullRequest.outputs.pull-request-number }}
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: gh pr merge --merge --auto ${{ steps.pullRequest.outputs.pull-request-number }}
