name: Test Dependencies

on: [ push, pull_request, workflow_dispatch ]

permissions: read-all

jobs:
    packages:
        runs-on: ubuntu-latest
        outputs:
            directories: ${{ steps.set-dirs.outputs.directories }}
        steps:
            -   uses: actions/checkout@v7

            -   id: set-dirs
                run: |
                    directories=$(find src -mindepth 2 -maxdepth 2 -name composer.json -printf '%h\n' | sort | jq -R -s -c 'split("\n")[:-1]')
                    echo "directories=$directories" >> "$GITHUB_OUTPUT"

    install:
        needs: packages
        runs-on: ubuntu-latest

        strategy:
            fail-fast: true
            matrix:
                directory: ${{ fromJson(needs.packages.outputs.directories) }}
                php: [ "8.3", "8.4", "8.5" ]
                laravel: [ "12.0", "13.0" ]

        name: ${{ matrix.directory }}, p${{ matrix.php }}, l${{ matrix.laravel }}

        steps:
            -   uses: actions/checkout@v7

            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}

            -   name: Install dependencies
                working-directory: ${{ matrix.directory }}
                run: composer require --dev --update-with-all-dependencies 'laravel/framework:^${{ matrix.laravel }}' --no-interaction --no-progress

    install-master:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: true
            matrix:
                php: [ "8.4", "8.5" ]

        name: src/JsonFallback, p${{ matrix.php }}, dev-master

        steps:
            -   uses: actions/checkout@v7
            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}

            -   name: Install dependencies
                working-directory: src/JsonFallback
                run: |
                    composer require --dev --no-update laravel/framework:dev-master --no-interaction
                    composer update --no-interaction --no-progress
