laravel: '@testbench'

providers:
    - LaravelLang\Config\ServiceProvider
    - LaravelLang\Models\ServiceProvider
    - LaravelLang\Routes\ServiceProvider
    - Spatie\LaravelData\LaravelDataServiceProvider
    - Workbench\App\Providers\WorkbenchServiceProvider

migrations:
    - workbench/database/migrations

seeders:
    - Workbench\Database\Seeders\DatabaseSeeder

workbench:
    start: '/'
    install: true
    health: false
    discovers:
        api: false
        web: true
        commands: true
        components: false
        config: true
        factories: true
        views: false
    sync:
        -   from: lang/fr
            to: workbench/lang/fr
        -   from: storage
            to: workbench/storage
            reverse: true
    build:
        - asset-publish
        - create-sqlite-db
        - db-wipe
        - migrate-fresh
    assets:
        - laravel-assets

purge:
    directories:
        - lang
