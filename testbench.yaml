laravel: '@testbench'

providers:
    - LaravelLang\Config\LangConfigServiceProvider
    - LaravelLang\Models\LangModelsServiceProvider
    - LaravelLang\Publisher\LangPublisherServiceProvider
    - LaravelLang\Routes\LangRoutesServiceProvider
    - Workbench\App\Providers\WorkbenchServiceProvider

migrations:
    - workbench/database/migrations

seeders:
    - Workbench\Database\Seeders\DatabaseSeeder

workbench:
    start: '/'
    install: true
    health: false
    discovers:
        api: false
        web: true
        commands: true
        components: false
        config: true
        factories: true
        views: false
    sync:
        -   from: lang/fr
            to: workbench/lang/fr

purge:
    directories:
        - lang
